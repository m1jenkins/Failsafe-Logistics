<!DOCTYPE html>

<head>

  <style>
    @font-face { font-family: 'DM Sans'; src: url('/fonts/dm-sans-variable.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
    @font-face { font-family: 'Outfit'; src: url('/fonts/outfit-variable.woff2') format('woff2'); font-weight: 300 900; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; background: #101116; color: #fff; font-family: 'DM Sans', sans-serif; }

    header { border-bottom: 1px solid rgba(255,255,255,.18); }

    .wordmark { color: #fff; text-decoration: none; display: inline-flex; flex-direction: column; line-height: .85; }
    .wordmark strong { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: -.035em; }
    .wordmark span { margin-top: 7px; font-size: 9px; font-weight: 700; letter-spacing: .34em; }
    main { display: grid; place-items: center; padding: 64px 20px; }
    .content { width: min(900px, 100%); }
    .check { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: #244ce8; }
    h1 { max-width: 780px; margin: 28px 0 0; font-family: 'Outfit', sans-serif; font-size: clamp(54px, 9vw, 96px); font-weight: 900; letter-spacing: -.035em; line-height: .84; text-transform: uppercase; }
    p { max-width: 620px; margin: 28px 0 0; color: rgba(255,255,255,.72); font-size: 18px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .actions a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 22px; border: 1px solid rgba(255,255,255,.35); border-radius: 5px; color: #fff; font-weight: 700; text-decoration: none; }
    .actions .primary { border-color: #244ce8; background: #244ce8; }
    .actions a:hover { border-color: #fff; }
  </style>
</head>

  <header><a class="wordmark" href="/" aria-label="Speedy Bat Couriers home"><strong>SPEEDY BAT</strong><span>COURIERS</span></a></header>
